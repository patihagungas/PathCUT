[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plate-nesting"
version = "0.1.0"
description = "Steel plate nesting application with DXF/NC1 support"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "ezdxf>=1.3",
    "shapely>=2.0",
    "spyrrow>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
]
gui = [
    "PySide6>=6.6",
]

[project.scripts]
plate-nesting = "plate_nesting.cli.main:main"

[project.gui-scripts]
pathcut = "plate_nesting.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/plate_nesting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
